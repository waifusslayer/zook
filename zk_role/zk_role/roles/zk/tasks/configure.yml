---
- name: Update configs
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ zk_conf_dir }}/{{ item }}"
    owner: "{{ zk_user }}"
    group: "{{ zk_group }}"
    mode: '0440'
    backup: true
  with_items:
    - zoo.cfg
    - java.env

- name: Deploy myid file
  ansible.builtin.template:
    src: "myid.j2"
    dest: "{{ zk_data_dir }}/myid"
    owner: "{{ zk_user }}"
    group: "{{ zk_group }}"
    mode: '0440'

- name: Create systemd unit
  ansible.builtin.template:
    src: "zookeeper.service.j2"
    dest: "/etc/systemd/system/zookeeper.service"
    mode: '0440'
    backup: true

- name: Change directory ownership
  ansible.builtin.file:
    dest: "{{ item }}"
    group: "{{ zk_group }}"
    owner: "{{ zk_user }}"
    recurse: true
  failed_when: false
  with_items:
    - "{{ zk_install_dir }}"
    - "{{ zk_data_dir }}"
    - "{{ zk_datalog_dir }}"
    - "{{ zk_log_dir }}"

- name: Enable and reload Zookeeper without restart
  ansible.builtin.systemd:
    daemon_reload: true
    name: zookeeper
    enabled: true
